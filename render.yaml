services:
  - type: web
    name: scribbledpage
    runtime: node
    buildCommand: npm ci && npm run build:paperbridge
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: LOG_LEVEL
        value: info
      - key: VITE_BRAND_NAME
        value: ScribbledPage
      - key: VITE_QR_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
