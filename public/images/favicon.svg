<svg width="166" height="166" viewBox="0 0 166 166" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark circle background -->
  <circle cx="83" cy="83" r="83" fill="#1c1917"/>

  <!-- sp-icon content scaled ×2, centered in the 166×166 circle -->
  <!-- Source viewBox 0 0 72 72; bounding box of content ~(10,10)-(52,55); -->
  <!-- scale(2) → box becomes (84×90); translate(21,18) centers it in 166×166 -->
  <g transform="translate(21, 18) scale(2)">
    <!-- Back page -->
    <rect x="18" y="18" width="34" height="44" rx="3"
          fill="rgba(255,255,255,0.07)" stroke="rgba(45,212,191,0.35)" stroke-width="1.5"/>
    <!-- Middle page -->
    <rect x="14" y="14" width="34" height="44" rx="3"
          fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Front page -->
    <rect x="10" y="10" width="34" height="44" rx="3"
          fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
    <!-- Red margin line -->
    <line x1="20" y1="13" x2="20" y2="51" stroke="rgba(252,165,165,0.55)" stroke-width="1"/>
    <!-- Ruled lines -->
    <line x1="22" y1="20" x2="41" y2="20" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <line x1="22" y1="26" x2="41" y2="26" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <line x1="22" y1="32" x2="41" y2="32" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <line x1="22" y1="38" x2="41" y2="38" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <line x1="22" y1="44" x2="41" y2="44" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- Scribble — the ScribbledPage brand signature -->
    <path d="M22 24 Q25 18 28 24 Q31 30 35 21 Q38 13 41 20"
          stroke="#2dd4bf" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pen tip -->
    <path d="M41 20 L43.5 18 L43 22 Z" fill="#2dd4bf" opacity=".75"/>
    <!-- QR code hint -->
    <rect x="27" y="41" width="14" height="14" rx="1.5"
          fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect x="29.5" y="43.5" width="4" height="4" rx=".6" fill="#2dd4bf"/>
    <rect x="35.5" y="43.5" width="4" height="4" rx=".6" fill="#2dd4bf"/>
    <rect x="29.5" y="49.5" width="4" height="4" rx=".6" fill="#2dd4bf"/>
    <rect x="35.5" y="49.5" width="1.8" height="1.8" rx=".4" fill="#2dd4bf"/>
    <rect x="37.7" y="47.5" width="1.8" height="1.8" rx=".4" fill="#2dd4bf"/>
    <rect x="33.5" y="47" width="1.8" height="1.8" rx=".4" fill="#2dd4bf"/>
  </g>
</svg>
